[platformio]
name = Audio_Signal_Visualiser
default_envs = esp32dev

[env:esp32dev]
; pioarduino: the community platform that carries the current Arduino-ESP32
; core (3.3.12, on ESP-IDF 5.5.5). PlatformIO's own espressif32 platform
; still ships the old 2.0.17 core. Pinned to an exact release so builds
; don't change underneath you. Build from a normal Windows terminal (VS Code's
; PlatformIO buttons, PowerShell, cmd): its tool installer refuses to run
; inside Git Bash / MSYS.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600
monitor_filters = time, colorize

lib_deps =
  adafruit/Adafruit GFX Library @ ^1.12.2
  adafruit/Adafruit ILI9341    @ ^1.6.2

; The FFT uses the esp-dsp copy bundled with the core. Do not add esp-dsp to
; lib_ignore here: on this platform that strips the library out of the build.

build_flags =
  -O3
  -ffast-math
  -DESP_PLATFORM
